<h1>Order Form</h1>


<form id="orderForm">


<label for="name">
Name
</label>

<input
type="text"
id="name"
name="name"
placeholder="Enter your name"
>


<label for="email">
Email
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email"
>


<label for="product">
Product
</label>

<select id="product" name="product">

<option value="">
Select a product
</option>

<option value="Moon Tarot">
Moon Tarot
</option>

<option value="Crystal Tarot">
Crystal Tarot
</option>

<option value="Lavender Incense">
Lavender Incense
</option>

<option value="Sandalwood Incense">
Sandalwood Incense
</option>

</select>


<label for="message">
Message
</label>

<textarea
id="message"
name="message"
placeholder="Enter your message"
></textarea>


<button type="submit">
Submit Order
</button>


<p id="formMessage"></p>


</form>


<footer>

<p>© 2026 PCR Whimsical Shop</p>

</footer>
