<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order - PCR Whimsical Shop</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <!-- NAVIGATION BAR -->

    <nav class="navbar">

        <div class="nav-logo">
            PCR WHIMSICAL SHOP
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="tarot.html">Tarot Cards</a>

            <a href="incense.html">Incense</a>

            <a href="gallery.html">Gallery</a>

            <a href="contact.html">Order</a>

        </div>

    </nav>


    <!-- MAIN CONTENT -->

    <main>

        <h1>✨ Place Your Order ✨</h1>

        <p class="page-intro">
            Choose your favourite magical item from PCR Whimsical Shop.
        </p>


        <!-- ORDER FORM -->

        <form
            id="orderForm"
            action="process_order.php"
            method="POST"
        >

            <!-- NAME -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PRODUCT -->

            <label for="product">
                Product
            </label>

            <select
                id="product"
                name="product"
                required
            >

                <option value="">
                    -- Select a product --
                </option>

                <option value="Rider-Waite Tarot - KSh 2,500">
                    Rider-Waite Tarot - KSh 2,500
                </option>

                <option value="Moonlight Tarot - KSh 3,000">
                    Moonlight Tarot - KSh 3,000
                </option>

                <option value="Lavender Incense - KSh 800">
                    Lavender Incense - KSh 800
                </option>

                <option value="Sandalwood Incense - KSh 1,000">
                    Sandalwood Incense - KSh 1,000
                </option>

            </select>


            <!-- MESSAGE -->

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Enter any special request..."
                required
            ></textarea>


            <!-- SUBMIT BUTTON -->

            <button type="submit">
                ✨ Submit Order
            </button>


            <!-- JAVASCRIPT MESSAGE -->

            <p id="formMessage"></p>

        </form>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 PCR Whimsical Shop | Made with ✨
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
